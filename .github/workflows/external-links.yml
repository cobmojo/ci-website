name: External link audit

# Separate from CI, on purpose.
#
# Fetching thirty third-party servers is the right thing to do before a launch
# and once a month afterwards. It is the wrong thing to put in front of every
# pull request: a gate that fails because someone else's host is down teaches
# people to re-run it rather than read it, and a gate nobody reads is not one.
on:
  schedule:
    # 07:20 UTC on the first of the month. Off the hour, because everything is
    # scheduled on the hour and GitHub queues it.
    - cron: '20 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Fetch every published external link
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit
        run: bun run content:links:external

      # The record of what answered and what did not, kept long enough to
      # compare one month against the next.
      - name: Machine-readable result
        if: always()
        run: bun run content:links:external -- --json > external-links.json || true

      - name: Upload the audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: external-link-audit
          path: external-links.json
          retention-days: 180
