name: CI

# Every gate this repository has, run on the code as pushed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Turbo's own telemetry has nothing to tell us and adds a network call.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # A cold build of 121 pages plus the full browser suite.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          # Matches the packageManager field in package.json.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ~150 MB, and only changes when @playwright/test does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Three engines, because the text-geometry contract compares Pretext's
      # predicted line breaking against each of them: they shape and break text
      # with their own code, and agreement in one says nothing about the others.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      # `validate` chains every gate in dependency order; the last few read the
      # build output, so they run after it.
      - name: Validate
        run: bun run validate

      # `validate` regenerates committed files. If any of them differs from what
      # is checked in, the checkout is out of date with its own generators.
      - name: No generated file drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::A generated file differs from what is committed. Run 'bun run validate' locally and commit the result."
            exit 1
          fi

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Accessibility tests
        run: bun run test:a11y

      # The gate for this integration and for any future Pretext upgrade. The
      # build is already cached by `validate`, so this costs a server start.
      - name: Text geometry tests
        run: bun run test:text-geometry

      # The only way to see what a headless browser saw.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/conditional-immortality/playwright-report/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/conditional-immortality/test-results/
          retention-days: 14
