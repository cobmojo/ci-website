name: Visual baselines

# Produce the Linux screenshot baselines, in the image the visual gate compares
# against.
#
# Screenshot baselines belong to the platform that made them: font hinting,
# text rasterisation and scrollbar metrics differ between operating systems, so
# a baseline written on a developer's machine is not a baseline the CI job can
# use. This job writes the Linux pair inside the same pinned Playwright image
# that `ci.yml`'s visual job runs in, and uploads them.
#
# Deliberately manual, and deliberately not committing anything itself. A
# baseline is an approval: someone has to look at the images before they become
# the definition of "correct". Download the artifact, look at every one, and
# commit them into
# `apps/conditional-immortality/tests/e2e/visual.spec.ts-snapshots/`.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why these are being regenerated (recorded in the run)
        required: true
        default: First run - no Linux baselines exist yet

permissions:
  contents: read

jobs:
  baselines:
    name: Write and upload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble

    env:
      NEXT_PUBLIC_ALLOW_LOCALHOST_SITE_URL: 1
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Why
        run: echo "${{ inputs.reason }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:local

      - name: Write the baselines
        run: cd apps/conditional-immortality && bunx playwright test --project=visual --update-snapshots

      # A baseline that does not reproduce against itself is not a baseline.
      # This catches anything still moving between two runs — an unsettled
      # font, an animation, a changing count — before the images are trusted.
      - name: Prove they are stable against themselves
        run: cd apps/conditional-immortality && bunx playwright test --project=visual

      - name: Upload for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-visual-baselines
          path: apps/conditional-immortality/tests/e2e/visual.spec.ts-snapshots/*-linux.png
          retention-days: 30
          if-no-files-found: error
